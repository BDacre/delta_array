[project]
name = "delta-array"
version = "0.1.0"
description = "Control library and scripts for the prismatic delta robot array."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bailey Dacre", email = "baid@itu.com" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "protobuf>=3.20,<5",
    "matplotlib>=3.7",
    "ipdb>=0.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/delta_control"]

[tool.hatch.build.targets.wheel.sources]
"python/delta_control" = "delta_control"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
