syntax = "proto3";

message PoseRequest  {}
message DoneRequest  {}
message PoseResponse { repeated float joint_pos = 1; }
message DoneResponse { bool done = 1; }

// Whoami: the host asks a board for its chip-derived id (id_req) and the board
// answers with it (id_resp). Used for discovery — the host addresses id_req to
// the broadcast id (0) when it does not yet know the board's real id.
message IdRequest  {}
message IdResponse { uint32 id = 1; }

// Diagnostics telemetry: the host asks for per-motor control state (telemetry_req)
// and the board answers (telemetry_resp) with position, PID error, and the last
// applied signed PWM for all 12 motors. Used to characterize the motors (e.g.
// breakaway friction, open-loop velocity) and to observe closed-loop moves.
message TelemetryRequest  {}
message TelemetryResponse {
    repeated float  position = 1;   // 12, meters
    repeated float  error    = 2;   // 12, meters (joint_positions - target)
    repeated sint32 pwm      = 3;   // 12, last applied signed PWM (-255..255, 0 = released)
}

message StatusFrame {
    oneof kind {
        PoseRequest       pose_req       = 1;
        DoneRequest       done_req       = 2;
        PoseResponse      pose_resp      = 3;
        DoneResponse      done_resp      = 4;
        IdRequest         id_req         = 5;
        IdResponse        id_resp        = 6;
        TelemetryRequest  telemetry_req  = 7;
        TelemetryResponse telemetry_resp = 8;
    }
}

message MoveCommand       { repeated float joint_pos = 1; }
message TrajectoryCommand { repeated float joint_pos = 1; }
message ResetCommand      {}
message StopCommand       {}

// Open-loop diagnostics: drive a single motor at a fixed PWM, bypassing the PID.
// The board releases all other motors first (so this never fights the PID) and
// auto-releases the driven motor after duration_ms (a safety timeout, so a lost
// host can't leave a motor driven). Used to measure static-friction breakaway
// and open-loop velocity vs PWM.
message SetPwmCommand {
    uint32 motor_index = 1;   // 0..11
    sint32 pwm         = 2;   // signed: sign = direction, |pwm| clamped to 0..255
    uint32 duration_ms = 3;   // auto-release after this; 0 => default, clamped to the move timeout
}

// Runtime per-motor tuning. Overwrites the board's compiled defaults for the
// addressed motor(s) without reflashing, so a single firmware image can carry
// safe defaults while each physical board is calibrated from a host-side JSON
// (keyed by board id) pushed after connecting. Fields are proto3 `optional`, so
// a command may set only some of them; absent fields are left unchanged.
message SetConfigCommand {
    optional uint32 motor_index = 1;  // 0..11; absent => apply to all motors
    optional float  deadband    = 2;  // meters; |err| below this counts as settled
    optional sint32 bias_fwd    = 3;  // static feedforward PWM, FORWARD branch (0..255)
    optional sint32 bias_back   = 4;  // static feedforward PWM, BACKWARD branch (0..255)
}

message JointFrame {
    oneof kind {
        MoveCommand       move       = 1;
        TrajectoryCommand traj       = 2;
        ResetCommand      reset      = 3;
        StopCommand       stop       = 4;
        SetPwmCommand     set_pwm    = 5;
        SetConfigCommand  set_config = 6;
    }
}

// Acceptance ACK for JointFrame commands. Sent by the addressed board
// immediately after the command is parsed and validated. It reports whether
// the command was accepted; it does NOT report move completion (completion
// is still polled via StatusFrame.done_req).
enum AckStatus {
    ACK_OK              = 0;
    ACK_VALIDATION_FAIL = 1;  // joint_pos count wrong, traj dims invalid, etc.
    ACK_UNKNOWN_COMMAND = 2;  // unrecognized JointFrame.kind variant
}

message CommandAck {
    AckStatus status = 1;
}

message DeltaMessage {
    int32 id = 1;
    oneof payload {
        StatusFrame status = 2;
        JointFrame  joint  = 3;
        CommandAck  ack    = 4;
    }
}
