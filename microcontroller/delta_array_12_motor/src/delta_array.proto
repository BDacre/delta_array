syntax = "proto3";

message PoseRequest  {}
message DoneRequest  {}
message PoseResponse { repeated float joint_pos = 1; }
message DoneResponse { bool done = 1; }

message StatusFrame {
    oneof kind {
        PoseRequest  pose_req  = 1;
        DoneRequest  done_req  = 2;
        PoseResponse pose_resp = 3;
        DoneResponse done_resp = 4;
    }
}

message MoveCommand       { repeated float joint_pos = 1; }
message TrajectoryCommand { repeated float joint_pos = 1; }
message ResetCommand      {}
message StopCommand       {}

message JointFrame {
    oneof kind {
        MoveCommand       move  = 1;
        TrajectoryCommand traj  = 2;
        ResetCommand      reset = 3;
        StopCommand       stop  = 4;
    }
}

// Acceptance ACK for JointFrame commands. Sent by the addressed board
// immediately after the command is parsed and validated. It reports whether
// the command was accepted; it does NOT report move completion (completion
// is still polled via StatusFrame.done_req).
enum AckStatus {
    ACK_OK              = 0;
    ACK_VALIDATION_FAIL = 1;  // joint_pos count wrong, traj dims invalid, etc.
    ACK_UNKNOWN_COMMAND = 2;  // unrecognized JointFrame.kind variant
}

message CommandAck {
    AckStatus status = 1;
}

message DeltaMessage {
    int32 id = 1;
    oneof payload {
        StatusFrame status = 2;
        JointFrame  joint  = 3;
        CommandAck  ack    = 4;
    }
}
